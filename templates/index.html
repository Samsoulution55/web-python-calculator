<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Python Calculator</title>
    <!-- This line links your python server data to your style sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="calculator-card">
        <h2>Python Web Calculator</h2>
        <form method="POST">
            <input type="number" name="num1" step="any" placeholder="First Number" required>
            
            <select name="operation">
                <option value="add">+</option>
                <option value="subtract">-</option>
                <option value="multiply">*</option>
                <option value="divide">/</option>
            </select>
            
            <input type="number" name="num2" step="any" placeholder="Second Number" required>
            <br><br>
            <button type="submit">Calculate</button>
        </form>
        <!-- This placeholder renders the error banner if an issue happens -->
        {% if error %}
            <div class="result-box" style="background-color: #f8d7da; color: #721c24;">
                {{ error }}
            </div>
        {% endif %}

        <!-- This placeholder only renders if a successful calculation happened -->
        {% if result != "" and not error %}
            <div class="result-box">
                Result: {{ result }}
            </div>
        {% endif %}
    </div>
</body>
</html>
